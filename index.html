<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Web MIDI Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #eee;
      color: #111;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
    }
    #log {
      margin-top: 20px;
      white-space: pre-wrap;
      background: #222;
      padding: 10px;
      border-radius: 6px;
      height: 300px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <h1>Web MIDI Test</h1>
  <button id="startBtn">Enable MIDI</button>
  <div id="log"></div>

  <script>
    const logDiv = document.getElementById("log");
    const btn = document.getElementById("startBtn");

    function log(msg) {
      logDiv.textContent += msg + "\n";
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    btn.onclick = async () => {
      if (!navigator.requestMIDIAccess) {
        log("Web MIDI not supported in this browser.");
        return;
      }

      try {
        const midi = await navigator.requestMIDIAccess();
        log("MIDI access granted.");

        if (midi.inputs.size === 0) {
          log("No MIDI devices detected.");
        }

        for (let input of midi.inputs.values()) {
          log("Input: " + input.name);

          input.onmidimessage = (event) => {
            const [status, data1, data2] = event.data;
            log(
              `Message: status=${status} note=${data1} velocity=${data2}`
            );
          };
        }

      } catch (err) {
        log("MIDI access denied or failed: " + err);
      }
    };
  </script>
  <div id="output"></div>
<script type="module">
  import { Renderer, Stave, StaveNote, Voice, Formatter } 
    from "https://unpkg.com/vexflow@5.0.0/build/esm/entry/vexflow.js";

  const div = document.getElementById("output");

  const renderer = new Renderer(div, Renderer.Backends.SVG);
  renderer.resize(300, 150);

  const context = renderer.getContext();
  const stave = new Stave(10, 40, 280);
  stave.addClef("treble").setContext(context).draw();

  const notes = [
    new StaveNote({ keys: ["c/4"], duration: "q" }),
    new StaveNote({ keys: ["d/4"], duration: "q" }),
  ];

  const voice = new Voice({ num_beats: 2, beat_value: 4 });
  voice.setStrict(false);
  voice.addTickables(notes);

  new Formatter().joinVoices([voice]).format([voice], 200);
  voice.draw(context, stave);
</script>
</body>
</html>
